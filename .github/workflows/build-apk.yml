name: Build Stream 22 Release APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: stream22-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. Checkout repository
      # =========================================
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # =========================================
      # 2. Setup Java 17
      # =========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================
      # 3. Setup Flutter
      # =========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # =========================================
      # 4. Setup Android SDK
      # =========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================
      # 5. Accept Android licenses
      # =========================================
      - name: Accept Android Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # =========================================
      # 6. Create local.properties
      # =========================================
      - name: Create local.properties
        shell: bash
        run: |
          printf '%s\n' \
            "flutter.sdk=$FLUTTER_ROOT" \
            "sdk.dir=$ANDROID_HOME" \
            > android/local.properties

          echo "Created android/local.properties"

      # =========================================
      # 7. Configure Gradle
      # =========================================
      - name: Configure Gradle
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.vfs.watch=false
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
          EOF

      # =========================================
      # 8. Setup Gradle 9.3.1
      # =========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # =========================================
      # 9. Verify project structure
      # =========================================
      - name: Verify Project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STREAM 22 PROJECT"
          echo "========================================"

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Android files:"
          ls -la android

          echo ""
          echo "Required files:"

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "pubspec.yaml                OK"
          echo "lib/                        OK"
          echo "android/                    OK"
          echo "settings.gradle.kts        OK"
          echo "app/build.gradle.kts       OK"
          echo "gradle-wrapper.properties OK"

      # =========================================
      # 10. Show toolchain
      # =========================================
      - name: Show Toolchain
        shell: bash
        run: |
          echo "========================================"
          echo "FLUTTER"
          echo "========================================"

          flutter --version

          echo ""
          echo "========================================"
          echo "DART"
          echo "========================================"

          dart --version

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          gradle --version

      # =========================================
      # 11. Flutter Doctor
      # =========================================
      - name: Flutter Doctor
        shell: bash
        run: |
          flutter doctor -v

      # =========================================
      # 12. Clean
      # =========================================
      - name: Flutter Clean
        shell: bash
        run: |
          flutter clean

      # =========================================
      # 13. Get dependencies
      # =========================================
      - name: Flutter Pub Get
        shell: bash
        run: |
          flutter pub get

      # =========================================
      # 14. Precache Android artifacts
      # =========================================
      - name: Precache Flutter Android
        shell: bash
        run: |
          flutter precache --android

      # =========================================
      # 15. Show package information
      # =========================================
      - name: Verify RTMP Package
        shell: bash
        run: |
          flutter pub deps --style=compact

      # =========================================
      # 16. Analyze
      # =========================================
      - name: Flutter Analyze
        shell: bash
        run: |
          flutter analyze

      # =========================================
      # 17. Tests
      # =========================================
      - name: Flutter Test
        shell: bash
        run: |
          flutter test

      # =========================================
      # 18. Check Flutter suggestions
      # =========================================
      - name: Flutter Analyze Suggestions
        shell: bash
        run: |
          flutter analyze --suggestions

      # =========================================
      # 19. Build APK
      # =========================================
      - name: Build Stream 22 APK
        shell: bash
        env:
          GRADLE_OPTS: '-Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false'
        run: |
          set -e

          echo "========================================"
          echo "BUILD STREAM 22 APK"
          echo "========================================"

          flutter build apk --release

      # =========================================
      # 20. Search for generated APK
      # =========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name '*.apk' \
            -print || true

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK_PATH="$(
            find "$GITHUB_WORKSPACE/build" \
              -type f \
              -name '*.apk' \
              | head -n 1 || true
          )"

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build directory contents:"
            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 10 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/output/streamgit101-V21-release.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/output/streamgit101-V21-release.apk"

      # =========================================
      # 21. Verify APK
      # =========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/output/streamgit101-V21-release.apk"

          test -f "$APK"

          SIZE="$(stat -c%s "$APK")"

          echo "========================================"
          echo "APK VERIFICATION"
          echo "========================================"

          echo "Path:"
          echo "$APK"

          echo ""
          echo "Size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo ""
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

          echo ""
          echo "APK verification passed."

      # =========================================
      # 22. Upload Artifact
      # =========================================
      - name: Upload Stream 22 APK
        uses: actions/upload-artifact@v4
        with:
          name: streamgit101-V21-APK
          path: output/streamgit101-V21-release.apk
          if-no-files-found: error
          retention-days: 30
