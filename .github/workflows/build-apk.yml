name: Build Stream 22 Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Prepare Local Properties
        shell: bash
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Configure Gradle
        shell: bash
        run: |
          touch android/gradle.properties

          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.nonTransitiveRClass=true" >> android/gradle.properties
          echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> android/gradle.properties
          echo "kotlin.suppressVersionWarnings=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8" >> android/gradle.properties

      - name: Flutter Doctor
        shell: bash
        run: |
          flutter doctor -v

      - name: Flutter Clean
        shell: bash
        run: |
          flutter clean

      - name: Install Dependencies
        shell: bash
        run: |
          flutter pub get

      - name: Analyze Code
        shell: bash
        run: |
          flutter analyze

      - name: Run Unit and Widget Tests
        shell: bash
        run: |
          flutter test

      - name: Build Android Release APK
        shell: bash
        env:
          GRADLE_OPTS: '-Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false'
        run: |
          set -e

          echo "========================================"
          echo "BUILD STREAM 22 APK"
          echo "========================================"

          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name '*.apk' \
            -print

          APK_PATH="$(find "$GITHUB_WORKSPACE/build" \
            -type f \
            -name '*.apk' \
            | head -n 1 || true)"

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build directory contents:"
            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 10 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/output/Stream22-release.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/output/Stream22-release.apk"

      - name: Validate APK Size
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/output/Stream22-release.apk"

          test -f "$APK"

          SIZE="$(stat -c%s "$APK")"

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo "APK validation passed."

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stream22-release-apk
          path: output/Stream22-release.apk
          if-no-files-found: error
          retention-days: 30
