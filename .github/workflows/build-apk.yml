name: Build Stream 22 Release APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: stream22-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Create local.properties
        shell: bash
        run: |
          printf '%s\n' \
            "flutter.sdk=$FLUTTER_ROOT" \
            "sdk.dir=$ANDROID_HOME" \
            > android/local.properties

      - name: Configure Gradle
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.vfs.watch=false
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STREAM 22 PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Android files:"
          ls -la android

          echo ""
          echo "Checking required files..."

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "pubspec.yaml: OK"
          echo "lib/: OK"
          echo "android/: OK"
          echo "settings.gradle.kts: OK"
          echo "build.gradle.kts: OK"
          echo "app/build.gradle.kts: OK"
          echo "gradle-wrapper.properties: OK"

      - name: Show Gradle Wrapper
        shell: bash
        run: |
          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Show Android Settings
        shell: bash
        run: |
          echo "========================================"
          echo "ANDROID SETTINGS"
          echo "========================================"

          cat android/settings.gradle.kts

      - name: Show Root Android Gradle
        shell: bash
        run: |
          echo "========================================"
          echo "ANDROID BUILD.GRADLE.KTS"
          echo "========================================"

          cat android/build.gradle.kts

      - name: Show App Gradle
        shell: bash
        run: |
          echo "========================================"
          echo "APP BUILD.GRADLE.KTS"
          echo "========================================"

          cat android/app/build.gradle.kts

      - name: Flutter Doctor
        shell: bash
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Flutter Clean
        shell: bash
        run: |
          flutter clean

      - name: Flutter Pub Get
        shell: bash
        run: |
          flutter pub get

      - name: Precache Flutter Android
        shell: bash
        run: |
          flutter precache --android

      - name: Flutter Analyze
        shell: bash
        run: |
          flutter analyze

      - name: Flutter Test
        shell: bash
        run: |
          flutter test

      - name: Flutter Analyze Suggestions
        shell: bash
        run: |
          flutter analyze --suggestions

      - name: Build Stream 22 APK
        shell: bash
        env:
          GRADLE_OPTS: '-Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false'
        run: |
          set -e

          echo "========================================"
          echo "BUILD STREAM 22 APK"
          echo "========================================"

          flutter build apk --release

      - name: Search For APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name '*.apk' \
            -print || true

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK_PATH="$(
            find "$GITHUB_WORKSPACE/build" \
              -type f \
              -name '*.apk' \
              | head -n 1 || true
          )"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build directory contents:"
            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 10 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/output/streamgit101-V22-release.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/output/streamgit101-V22-release.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/output/streamgit101-V22-release.apk"

          test -f "$APK"

          SIZE="$(stat -c%s "$APK")"

          echo "========================================"
          echo "APK VERIFIED"
          echo "========================================"

          echo "File:"
          echo "$APK"

          echo ""
          echo "Size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

          echo ""
          echo "APK verification passed."

      - name: Upload Stream 22 APK
        uses: actions/upload-artifact@v4
        with:
          name: streamgit101-V22-APK
          path: output/streamgit101-V22-release.apk
          if-no-files-found: error
          retention-days: 30
